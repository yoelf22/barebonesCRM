<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>barebonesCRM</title>
<link rel="icon" href="favicon.ico">
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f7f7f5; color:#1f1f1d; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif; font-size:14px; line-height:1.45; }
.wrap { max-width:1040px; margin:0 auto; padding:20px 18px 60px; }
h1 { font-size:20px; font-weight:600; margin:0 0 2px; }
.sub { color:#6b6b66; font-size:13px; margin:0 0 14px; }
.banner { background:#fff3cd; border:1px solid #ffe08a; color:#7a5a00; padding:10px 12px; border-radius:8px; margin-bottom:14px; font-size:13px; }
.tabs { display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid #e7e7e2; }
.tab { font:inherit; font-size:14px; font-weight:600; padding:8px 16px; border:none; background:none; cursor:pointer; color:#6b6b66; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab:hover { color:#1f1f1d; }
.tab.active { color:#1f1f1d; border-bottom-color:#1f6feb; }
.card { background:#fff; border:1px solid #e7e7e2; border-radius:10px; margin-bottom:10px; padding:12px 14px; }
.card h3 { margin:0 0 2px; font-size:15px; }
.muted { color:#8a8a82; font-size:12px; }
.row { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid #f0f0ec; }
.row:first-child { border-top:none; }
.row .main { font-weight:600; }
.row .meta { color:#8a8a82; font-size:12px; }
a.link { color:#1f6feb; text-decoration:none; cursor:pointer; }
a.link:hover { text-decoration:underline; }
.badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
.b-active { background:#eaf1ff; color:#1f6feb; }
.b-won { background:#e4f6ea; color:#1c7a3f; }
.b-lost { background:#f1f1ee; color:#9a9a92; }
.b-paid { background:#fde8e8; color:#b42318; }
.b-vendor { background:#fde7d3; color:#9a5b00; }
.b-mismatch { background:#fff0c2; color:#8a5a00; }
.b-me { background:#fde8e8; color:#b42318; }
.b-them { background:#eef0f2; color:#6b6b66; }
.funnel { display:flex; height:14px; border-radius:7px; overflow:hidden; margin:8px 0 4px; background:#f1f1ee; }
.funnel span { display:block; }
.f-active { background:#1f6feb; }
.f-won { background:#1c7a3f; }
.f-lost { background:#c9c9c2; }
.pct { font-variant-numeric:tabular-nums; font-weight:600; }
.controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
.controls label { font-size:12px; color:#6b6b66; display:flex; gap:4px; align-items:center; }
.controls select, .controls input { font:inherit; font-size:13px; padding:4px 6px; border:1px solid #d8d8d2; border-radius:6px; background:#fff; }
.btn { font:inherit; font-size:12px; font-weight:600; padding:5px 11px; border:1px solid #d8d8d2; border-radius:6px; background:#fff; cursor:pointer; }
.btn:hover { background:#f2f6ff; }
.btn.win { border-color:#1c7a3f; color:#1c7a3f; }
.btn.win:hover { background:#e4f6ea; }
.btn.drop { border-color:#e0b4ae; color:#b42318; }
.btn.drop:hover { background:#fde8e8; }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.actionbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0 2px; padding-top:8px; border-top:1px dashed #eee; }
.actionbar b { font-size:12px; color:#6b6b66; }
.flagbox { background:#fff8e6; border:1px solid #ffe08a; border-radius:8px; padding:8px 10px; margin:6px 0; font-size:13px; }
.flagbox .frow { margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.flagbox input { font:inherit; font-size:12px; padding:3px 6px; border:1px solid #d8d8d2; border-radius:5px; }
#search { width:100%; font:inherit; font-size:14px; padding:9px 12px; border:1px solid #d8d8d2; border-radius:8px; margin-bottom:12px; }
.err { color:#b42318; font-size:12px; margin-left:8px; }
.trail-row { display:flex; gap:8px; padding:4px 0; border-top:1px solid #f0f0ec; font-size:12px; }
.trail-when { color:#9a9a92; white-space:nowrap; font-variant-numeric:tabular-nums; }
.dead { opacity:.55; }
.kv { margin:2px 0; font-size:13px; }
.kv b { font-weight:600; color:#4a4a46; }
.ptable { width:100%; border-collapse:collapse; background:#fff; border:1px solid #e7e7e2; border-radius:10px; overflow:hidden; }
.ptable th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#6b6b66; padding:9px 12px; border-bottom:1px solid #e7e7e2; cursor:pointer; user-select:none; white-space:nowrap; }
.ptable th:hover { color:#1f1f1d; }
.ptable td { padding:8px 12px; border-top:1px solid #f0f0ec; font-size:13px; vertical-align:top; }
.ptable tbody tr { cursor:pointer; }
.ptable tbody tr:hover { background:#f2f6ff; }
.ptable .pname { font-weight:600; color:#1f6feb; }
.ptable .pnext { white-space:nowrap; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <h1 style="padding:8px 0"><img src="wordmark.svg" height="52" alt="barebonesCRM" style="display:block"></h1>
  <p class="sub" id="counts">loading…</p>
  <div id="banner"></div>
  <div class="tabs">
    <button class="tab" data-tab="today">Today</button>
    <button class="tab" data-tab="campaigns">Campaigns</button>
    <button class="tab" data-tab="people">People</button>
    <button class="tab" data-tab="import">Import CSV</button>
    <button class="tab" data-tab="unmatched">Unmatched</button>
    <button class="tab" data-tab="ask">Ask</button>
  </div>
  <div id="view"></div>
</div>

<script src="app-logic.js"></script>
<script>
const CAMPLABEL = {}; // optional display-name overrides by campaign id; empty = use each campaign's own name
const STRENGTH_RANK = { strong:0, medium:1, stretch:2 };
const view = document.getElementById("view");
let MODEL = null, RAW = null;
window.__tab = localStorage.getItem("_apptab") || "today";
window.__personId = null;
window.__psearch = "";
window.__sort = { col: "name", dir: 1 };
const PEOPLE_COLS = [
  { key:"name",     label:"Name",      val: l => l.name || "" },
  { key:"org",      label:"Org",       val: l => (MODEL.orgsById[l.orgId] || {}).name || "" },
  { key:"campaign", label:"Campaign",  val: l => campName(l.campaignId) },
  { key:"next",     label:"Next date", val: l => l.followUpDate || "" },
  { key:"status",   label:"Status",    val: l => l.state || "" },
];
function sortBy(key) {
  const s = window.__sort;
  if (s.col === key) s.dir = -s.dir; else { s.col = key; s.dir = 1; }
  drawPeople();
}
function drawPeople() {
  const res = document.getElementById("results"); if (!res) return;
  const q = (window.__psearch || "").trim().toLowerCase();
  const hits = RAW.leads.filter(l => {
    const o = MODEL.orgsById[l.orgId];
    return !q || (l.name||"").toLowerCase().includes(q) || (o && o.name.toLowerCase().includes(q));
  });
  const s = window.__sort, col = PEOPLE_COLS.find(c => c.key === s.col) || PEOPLE_COLS[0];
  hits.sort((a, b) => {
    let av = col.val(a), bv = col.val(b);
    if (s.col === "next") { av = av || "9999-99-99"; bv = bv || "9999-99-99"; } // blanks last
    return s.dir * String(av).localeCompare(String(bv), undefined, { numeric:true, sensitivity:"base" });
  });
  const arrow = k => s.col === k ? (s.dir > 0 ? " ▲" : " ▼") : "";
  let h = '<div class="muted" style="margin:0 0 8px">Showing ' + hits.length + ' of ' + RAW.leads.length + ' people' + (q ? ' matching "' + esc(q) + '"' : '') + '</div>';
  h += '<table class="ptable"><thead><tr>'
    + PEOPLE_COLS.map(c => '<th onclick="sortBy(\'' + c.key + '\')">' + c.label + arrow(c.key) + '</th>').join("")
    + '</tr></thead><tbody>';
  hits.forEach(l => {
    const o = MODEL.orgsById[l.orgId];
    h += '<tr onclick="openPerson(\'' + esc(l.id).replace(/'/g, "\\'") + '\')">'
      + '<td class="pname">' + esc(l.name || "(no name)") + '</td>'
      + '<td>' + esc(o ? o.name : "") + '</td>'
      + '<td>' + esc(campName(l.campaignId)) + '</td>'
      + '<td class="pnext">' + (l.followUpDate ? esc(ilTime(l.followUpDate)) : '<span class="muted">—</span>') + '</td>'
      + '<td>' + esc(l.state || "") + '</td></tr>';
  });
  h += '</tbody></table>';
  res.innerHTML = h;
}

function ilTime(iso, withTime) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const opts = withTime ? { timeZone:"Asia/Jerusalem", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }
                        : { timeZone:"Asia/Jerusalem", day:"numeric", month:"short", year:"numeric" };
  return d.toLocaleString("en-GB", opts);
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
// A ⚠ in a note is an unresolved flag. flagText = the caveat (⚠ to end); stripFlag = the note without it.
function flagText(notes){ const i = String(notes||"").indexOf("⚠"); return i < 0 ? null : notes.slice(i).trim(); }
function stripFlag(notes){ const i = String(notes||"").indexOf("⚠"); return i < 0 ? notes : notes.slice(0, i).replace(/\s*·\s*$/,"").trim(); }
function campName(id){ const c = MODEL.campaignsById[id]; return c ? (CAMPLABEL[c.id]||c.name) : id; }
function kindBadge(kind){ const cls={active:"b-active",won:"b-won",lost:"b-lost"}[kind]||"b-lost"; return '<span class="badge '+cls+'">'+kind+'</span>'; }

async function load() {
  try {
    const [campaigns, orgs, leads, trail, comments, observations, unmatched] = await Promise.all(
      ["/campaigns","/organizations","/leads","/trail","/comments","/observations","/unmatched"].map(u => fetch(u).then(r => r.json())));
    RAW = { campaigns, orgs, leads, trail, comments, observations, unmatched };
    document.querySelector('[data-tab="unmatched"]').textContent = "Unmatched" + (unmatched.length ? " (" + unmatched.length + ")" : "");
    MODEL = AppLogic.buildModel(campaigns, orgs, leads, trail);
    document.getElementById("counts").textContent =
      leads.length + " leads · " + orgs.length + " orgs · " + campaigns.length + " campaigns";
    document.getElementById("banner").innerHTML =
      (location.protocol === "file:") ? '<div class="banner">Opened as a file — read-only. Run <b>python3 crm.py</b> and open http://localhost:8787/app.html to edit.</div>' : "";
    render();
  } catch (e) {
    document.getElementById("banner").innerHTML =
      '<div class="banner">Could not load data — is the server running? Start it with <b>python3 crm.py</b>.</div>';
  }
}

function setTab(t){ window.__tab = t; localStorage.setItem("_apptab", t); render(); }
function openPerson(id){ window.__personId = id; setTab("people"); }

function render() {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.dataset.tab === window.__tab));
  if (!MODEL) return;
  if (window.__tab === "today") renderToday();
  else if (window.__tab === "campaigns") renderCampaigns();
  else if (window.__tab === "import") renderImport();
  else if (window.__tab === "unmatched") renderUnmatched();
  else if (window.__tab === "ask") renderAsk();
  else renderPerson();
}

// ---- Today ----
// A bot needsAction flag counts only until the user acts on the lead (a non-bot Log entry
// newer than the inbound that raised it). The Person view still shows the raw signal.
function flagged(l) {
  const ob = (RAW.observations || {})[l.id];
  return !!(ob && ob.needsAction && !AppLogic.actedSince(RAW.comments, l.id, ob.lastInbound || ob.ts));
}
// For a live calendar flag, the bot's reason minus its prefix — "event is 6 May 09:00, CRM says 2027-05-05".
function cal(l) {
  const r = flagged(l) ? String((RAW.observations[l.id] || {}).reason || "") : "";
  return r.startsWith("calendar:") ? r.slice(9).trim() : "";
}
function renderToday() {
  const now = new Date();
  const obs = RAW.observations || {};
  const rows = RAW.leads.filter(l => {
    const active = AppLogic.stateKind(MODEL.campaignsById[l.campaignId], l.state) === "active";
    return flagged(l) || (active && AppLogic.leadDue(l, now)) || l.waiting === "me";
  }).sort((a,b) => (STRENGTH_RANK[a.strength]-STRENGTH_RANK[b.strength])
      || (String(a.followUpDate||"9999")).localeCompare(String(b.followUpDate||"9999")));
  const today = now.toISOString().slice(0,10);
  const overdue = rows.filter(l => l.followUpDate && l.followUpDate < today);
  const future  = rows.filter(l => l.followUpDate && l.followUpDate > today);   // surfaced by a bot flag or "you owe"
  const current = rows.filter(l => !overdue.includes(l) && !future.includes(l));
  const row = l => {
    const org = MODEL.orgsById[l.orgId];
    return '<div class="row"><div><div class="main"><a class="link" onclick="openPerson(\''+esc(l.id)+'\')">'+esc(l.name)+'</a>'
      + (flagged(l)?('<span class="badge b-me">'+(String(obs[l.id].reason||"").startsWith("calendar:")?"calendar — check":"reply — act")+'</span>'):'')
      + (l.waiting==="me"?'<span class="badge b-me">you owe</span>':'')+'</div>'
      + '<div class="meta">'+esc(org?org.name:"")+' · '+esc(campName(l.campaignId))+' · '+esc(l.state)+'</div></div>'
      + '<div class="meta">'+(cal(l) ? esc(cal(l)) : (l.followUpDate?((l.followUpDate < today ? "overdue since " : "due ")+ilTime(l.followUpDate)):""))+'</div></div>';
  };
  let h = '<div class="card"><h3>Today ('+current.length+')</h3>'
    + (current.length ? current.map(row).join('') : '<p class="muted">Nothing due — inbox zero.</p>') + '</div>';
  if (overdue.length) h += '<div class="card"><h3>Overdue ('+overdue.length+')</h3>' + overdue.map(row).join('') + '</div>';
  if (future.length)  h += '<div class="card"><h3>Future, flagged ('+future.length+')</h3>' + future.map(row).join('') + '</div>';
  view.innerHTML = h;
}

// ---- Campaigns ----
function renderCampaigns() {
  let h = "";
  RAW.campaigns.forEach(c => {
    const leads = MODEL.leadsByCampaign[c.id] || [];
    const f = AppLogic.campaignFunnel(c, leads);
    const unit = c.targetType === "organization"
      ? new Set(leads.map(l => l.orgId)).size + " orgs"
      : leads.length + " people";
    const needs = leads.filter(l => l.waiting === "me" ||
      (AppLogic.stateKind(c, l.state)==="active" && AppLogic.leadDue(l, new Date()))).length;
    const pc = f.total || 1;
    h += '<div class="card"><h3>'+esc(CAMPLABEL[c.id]||c.name)+'</h3>'
      + '<div class="muted">'+esc(c.targetType)+' · '+unit+' · goal: '+esc(c.goal||"—")+'</div>'
      + '<div class="funnel">'
      +   '<span class="f-active" style="width:'+(100*f.byKind.active/pc)+'%"></span>'
      +   '<span class="f-won" style="width:'+(100*f.byKind.won/pc)+'%"></span>'
      +   '<span class="f-lost" style="width:'+(100*f.byKind.lost/pc)+'%"></span>'
      + '</div>'
      + '<div class="muted"><span class="pct">'+f.pctWon+'%</span> reached goal · '
      +   f.byKind.active+' active · '+f.byKind.won+' won · '+f.byKind.lost+' lost · '
      +   '<b>'+needs+'</b> need action</div>'
      + '<details><summary class="link" style="margin-top:6px">show '+leads.length+' leads</summary>';
    leads.slice().sort((a,b)=>String(a.state).localeCompare(String(b.state))).forEach(l => {
      const org = MODEL.orgsById[l.orgId];
      h += '<div class="row"><div class="main"><a class="link" onclick="openPerson(\''+esc(l.id)+'\')">'+esc(l.name)+'</a></div>'
        + '<div class="meta">'+esc(org?org.name:"")+' · '+esc(l.state)+'</div></div>';
    });
    h += '</details></div>';
  });
  view.innerHTML = h;
}

// ---- Person ----
function renderPerson() {
  if (!window.__personId) {
    view.innerHTML = '<input id="search" placeholder="Search people by name or org…" autocomplete="off" value="'+esc(window.__psearch||"")+'"><div id="results"></div>';
    const box = document.getElementById("search");
    box.oninput = () => { window.__psearch = box.value; drawPeople(); };
    drawPeople();
    return;
  }
  const l = MODEL.leadsById[window.__personId];
  if (!l) { view.innerHTML = '<div class="card">Lead not found. <a class="link" onclick="window.__personId=null;render()">back</a></div>'; return; }
  const idJs = esc(l.id).replace(/'/g, "\\'");
  const c = MODEL.campaignsById[l.campaignId], org = MODEL.orgsById[l.orgId];
  const roll = org ? AppLogic.orgRollup(org, MODEL.leadsByOrg, MODEL.campaignsById) : null;
  const fa = l.facts || {};
  let badges = "";
  if (fa.paidStatus === "paid") badges += '<span class="badge b-paid">paid</span>';
  if (fa.paidStatus === "vendor-placed") badges += '<span class="badge b-vendor">vendor-placed</span>';
  if (fa.formatRequested && fa.formatSent && fa.formatRequested !== fa.formatSent)
    badges += '<span class="badge b-mismatch">format mismatch</span>';

  let h = '<div style="margin-bottom:10px"><a class="link" onclick="window.__personId=null;render()">← all people</a></div>';
  h += '<div class="card"><h3>'+esc(l.name)+' '+badges
     + (l.gmailThreadId ? '<a class="btn" style="float:right" href="https://mail.google.com/mail/u/0/#all/'+esc(l.gmailThreadId)+'" target="_blank">Open Gmail thread ↗</a>' : '')
     + '</h3>';
  h += '<div class="kv"><b>Org:</b> '+esc(org?org.name:"—")
     + (roll?(' <span class="badge '+(roll.alive?"b-active":"b-lost")+'">'+(roll.alive?"alive":"dead")+'</span> '
        + '<span class="muted">'+roll.leadCount+' lead(s): '+roll.counts.active+' active / '+roll.counts.won+' won / '+roll.counts.lost+' lost</span>'):'')+'</div>';
  h += '<div class="kv"><b>Campaign:</b> '+esc(campName(l.campaignId))+' · <b>state:</b> '+esc(l.state)+' '+kindBadge(AppLogic.stateKind(c,l.state))+'</div>';
  const ob = (RAW.observations || {})[l.id];
  if (ob && (ob.needsAction || (ob.suggestedState && ob.suggestedState !== l.state)))
    h += '<div class="flagbox">🔔 <b>Bot signal:</b> '
      + (ob.needsAction ? 'needs action' : '')
      + (ob.suggestedState && ob.suggestedState !== l.state ? (ob.needsAction ? ' · ' : '') + 'suggests state "'+esc(ob.suggestedState)+'"' : '')
      + (ob.reason ? ' — '+esc(ob.reason) : '')
      + (ob.lastInbound ? ' <span class="muted">(last inbound '+ilTime(ob.lastInbound,true)+')</span>' : '')
      + '</div>';
  h += '<div class="kv"><b>Waiting on:</b> <span class="badge '+(l.waiting==="me"?"b-me":"b-them")+'">'+esc(l.waiting)+'</span></div>';
  h += '<div class="kv"><b>Emails:</b> '+(l.emails&&l.emails.length?esc(l.emails.join(", ")):'<span class="muted">none on file</span>')+'</div>';
  if (l.role) h += '<div class="kv"><b>Role:</b> '+esc(l.role)+'</div>';
  const HANDLES = { linkedin:"LinkedIn", x:"X", website:"Website" };
  const hs = l.handles || {};
  const links = [];
  Object.keys(HANDLES).forEach(k => { const u = safeUrl(hs[k]); if (u) links.push('<a class="link" href="'+esc(u)+'" target="_blank">'+HANDLES[k]+' ↗</a>'); });
  { const u = org && safeUrl(org.url); if (u) links.push('<a class="link" href="'+esc(u)+'" target="_blank">Org site ↗</a>'); }
  if (links.length) h += '<div class="kv"><b>Links:</b> '+links.join(' · ')+'</div>';
  if (fa.paidStatus && fa.paidStatus!=="free") h += '<div class="kv"><b>Paid:</b> '+esc(fa.paidStatus)+(fa.amount?(" ("+esc(fa.amount)+")"):"")+'</div>';
  if (fa.formatRequested || fa.formatSent) h += '<div class="kv"><b>Format:</b> asked '+esc(fa.formatRequested||"?")+' / sent '+esc(fa.formatSent||"?")+'</div>';
  const flag = flagText(l.notes);
  const noteBase = flag ? stripFlag(l.notes) : l.notes;
  if (noteBase) h += '<div class="kv"><b>Notes:</b> '+esc(noteBase)+'</div>';
  if (flag) {
    h += '<div class="flagbox">⚠ <b>Unresolved flag:</b> '+esc(flag.replace(/^⚠\s*/,""))
      + '<div class="frow">'
      +   '<button class="btn win" onclick="resolveFlag(\''+idJs+'\',\'approve\')">✓ Approve</button>'
      +   '<button class="btn drop" onclick="resolveFlag(\''+idJs+'\',\'ignore\')">✕ Ignore</button>'
      +   '<span class="muted">or</span>'
      +   '<input id="resolveinput" placeholder="write a resolution…" onkeydown="if(event.key===\'Enter\')resolveFlag(\''+idJs+'\',\'custom\')">'
      +   '<button class="btn" onclick="resolveFlag(\''+idJs+'\',\'custom\')">Resolve</button>'
      + '</div></div>';
  }

  // write-back controls
  const stateOpts = (c && c.states || []).map(s => '<option value="'+esc(s.key)+'"'+(s.key===l.state?" selected":"")+'>'+esc(s.label)+'</option>').join("");
  const wonState = (c && c.states || []).find(s => s.kind === "won");
  const lostState = (c && c.states || []).find(s => s.kind === "lost");
  h += '<div class="controls">'
    + '<label>State <select onchange="save(\''+idJs+'\',{state:this.value})">'+stateOpts+'</select></label>'
    + '<label>Follow-up <input type="date" value="'+esc(l.followUpDate||"")+'" onchange="save(\''+idJs+'\',{followUpDate:this.value||null})"></label>'
    + '<label>Waiting <select onchange="save(\''+idJs+'\',{waiting:this.value})"><option value="them"'+(l.waiting==="them"?" selected":"")+'>them</option><option value="me"'+(l.waiting==="me"?" selected":"")+'>me</option></select></label>'
    + '<span class="err" id="saveerr"></span></div>';
  h += '<div class="controls">'
    + '<label>Role <input value="'+esc(l.role||"")+'" placeholder="title / who they are" onchange="save(\''+idJs+'\',{role:this.value.trim()||null})"></label>'
    + '<label>LinkedIn <input value="'+esc((l.handles||{}).linkedin||"")+'" placeholder="https://linkedin.com/in/…" onchange="saveHandle(\''+idJs+'\',\'linkedin\',this.value)"></label>'
    + '<label>X <input value="'+esc((l.handles||{}).x||"")+'" placeholder="https://x.com/…" onchange="saveHandle(\''+idJs+'\',\'x\',this.value)"></label>'
    + '<label>Website <input value="'+esc((l.handles||{}).website||"")+'" placeholder="https://…" onchange="saveHandle(\''+idJs+'\',\'website\',this.value)"></label>'
    + '</div>';
  // Quick actions: schedule next touch (default 10 days), or close on win / drop
  h += '<div class="actionbar">'
    + '<b>Next touch:</b>'
    + '<button class="btn" onclick="snooze(\''+idJs+'\',10)">+10 days</button>'
    + '<label style="font-size:12px;color:#6b6b66">or <input type="number" id="ndays" value="10" min="1" style="width:52px"> days '
    + '<button class="btn" onclick="snooze(\''+idJs+'\',parseInt(document.getElementById(\'ndays\').value,10)||10)">set</button></label>'
    + '<span style="width:12px"></span><b>Close:</b>'
    + '<button class="btn win" onclick="closeAs(\''+idJs+'\',\'won\')"'+(wonState?'':' title="adds a Won state to this campaign"')+'>✓ Won</button>'
    + '<button class="btn drop" onclick="closeAs(\''+idJs+'\',\'lost\')"'+(lostState?'':' title="adds a Passed state to this campaign"')+'>✕ Drop</button>'
    + '</div>';

  // trail
  const tr = (MODEL.trailByLead[l.id] || []).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  h += '<div style="margin-top:8px"><b>Trail</b>';
  if (!tr.length) h += ' <span class="muted">— no trail events yet</span>';
  tr.forEach(e => h += '<div class="trail-row"><span class="trail-when">'+ilTime(e.date,true)+'</span>'
    + '<span>'+esc(e.direction||"")+' · '+esc(e.summary||"")+(e.gmailLink?(' <a class="link" href="'+esc(e.gmailLink)+'" target="_blank">↗</a>'):"")+'</span></div>');
  h += '</div>';
  // Log — your own dated notes & decisions (stored in comments.json, separate from the bot Trail)
  const log = (RAW.comments || []).filter(x => x.key === l.id)
    .slice().sort((a,b) => String(b.ts).localeCompare(String(a.ts)));
  h += '<div style="margin-top:12px"><b>Log</b> <span class="muted">— your dated notes & decisions</span>';
  h += '<div style="display:flex;gap:6px;margin:6px 0"><input id="noteinput" placeholder="Record a thought or decision…" '
    + 'style="flex:1;font:inherit;font-size:13px;padding:6px 8px;border:1px solid #d8d8d2;border-radius:6px" '
    + 'onkeydown="if(event.key===\'Enter\')addNote(\''+idJs+'\')">'
    + '<button class="btn" onclick="addNote(\''+idJs+'\')">Add</button></div>';
  if (!log.length) h += '<span class="muted" style="font-size:12px">No log entries yet.</span>';
  log.forEach(x => h += '<div class="trail-row"><span class="trail-when">'+ilTime(x.ts,true)+'</span>'
    + '<span>'+esc(x.text)+(x.link?(' <a class="link" href="'+esc(x.link)+'" target="_blank">↗</a>'):"")+' <span class="muted">— '+esc(x.author||"")+'</span></span></div>');
  h += '</div></div>';
  view.innerHTML = h;
}

// Resolve a ⚠ flag on a note: record a dated decision in the Log, then strip the flag from the note.
// Only render user/bot-entered URLs as links if they are real http(s) URLs (never javascript:).
function safeUrl(u){ return /^https?:\/\//i.test(String(u||"")) ? u : null; }
// Merge one handle into the lead's handles map and persist the whole map (apply_delta replaces it).
function saveHandle(id, key, val){
  const l = MODEL.leadsById[id]; const h = Object.assign({}, l.handles || {});
  const v = (val||"").trim(); if (v) h[key] = v; else delete h[key];
  save(id, { handles: h });
}

// A write does a git commit+push and can take a few seconds. Disable the detail's buttons
// and show "saving…" the instant a button is clicked, so it never looks dead. render() at
// the end of each handler rebuilds the detail, which re-enables everything.
function busy() {
  view.querySelectorAll("button").forEach(b => b.disabled = true);
  const s = document.getElementById("saveerr"); if (s) { s.textContent = "saving…"; s.classList.remove("err"); }
}

async function resolveFlag(id, verdict) {
  busy();
  const l = MODEL.leadsById[id]; if (!l) return;
  const flag = flagText(l.notes || ""); if (!flag) return;
  if (location.protocol === "file:") { alert("Read-only — open via http://localhost:8787/app.html to resolve."); return; }
  const custom = (document.getElementById("resolveinput") || {}).value;
  const text = (custom && custom.trim())
    ? "Flag resolved: " + custom.trim() + "  [" + flag + "]"
    : (verdict === "approve" ? "✓ Approved flag: " : "✕ Ignored flag: ") + flag;
  try {
    const rc = await fetch("/comment", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ key: id, text }) });
    if (rc.ok) RAW.comments = await rc.json();
    const rl = await fetch("/lead", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ id, notes: stripFlag(l.notes || "") }) });
    if (rl.ok) { RAW.leads = await rl.json(); MODEL = AppLogic.buildModel(RAW.campaigns, RAW.orgs, RAW.leads, RAW.trail); }
    render();
  } catch (e) { /* server down */ }
}

async function addNote(id) {
  const inp = document.getElementById("noteinput");
  const text = (inp && inp.value || "").trim();
  if (!text) return;
  busy();
  if (location.protocol === "file:") { alert("Read-only — open via http://localhost:8787/app.html to add notes."); return; }
  try {
    const r = await fetch("/comment", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ key: id, text }) });
    if (!r.ok) return;
    RAW.comments = await r.json(); // POST /comment returns the full comments list
    render();
  } catch (e) { /* server down — leave input as-is */ }
}

function snooze(id, days) {
  const d = new Date();
  d.setDate(d.getDate() + (days || 10));
  save(id, { followUpDate: d.toISOString().slice(0, 10), waiting: "them" });
}

// Won / Drop. A campaign that never defined a won or lost state gets one added first
// (POST /campaign), so the buttons always work instead of sitting disabled.
async function closeAs(id, kind) {
  busy();
  const l = MODEL.leadsById[id], c = MODEL.campaignsById[l.campaignId];
  const { state, isNew } = AppLogic.closeState(c, kind);
  if (isNew) {
    const err = document.getElementById("saveerr");
    try {
      const r = await fetch("/campaign", { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id: c.id, states: (c.states || []).concat([state]) }) });
      if (!r.ok) { if(err) err.textContent = "could not add state ("+r.status+")"; return; }
      RAW.campaigns = await r.json();
    } catch (e) { if(err) err.textContent = "server down — start crm.py"; return; }
  }
  await save(id, { state: state.key });
}
async function save(id, delta) {
  const err = document.getElementById("saveerr");
  if (location.protocol === "file:") { if(err) err.textContent = "read-only (open via localhost)"; return; }
  busy();
  try {
    const r = await fetch("/lead", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(Object.assign({ id }, delta)) });
    if (!r.ok) { if(err) err.textContent = r.status===404 ? "unknown id" : ("save failed ("+r.status+")"); return; }
    const leads = await r.json();
    RAW.leads = leads;
    MODEL = AppLogic.buildModel(RAW.campaigns, RAW.orgs, leads, RAW.trail);
    const rc = await fetch("/comments"); if (rc.ok) RAW.comments = await rc.json();  // the save also wrote a Log line
    render();
  } catch (e) { if(err) err.textContent = "server down — start crm.py"; }
}

// ---- Import CSV (onboarding) ----
function renderImport() {
  const camps = RAW.campaigns || [];
  const opts = camps.map(c => '<option value="'+esc(c.id)+'">'+esc(CAMPLABEL[c.id]||c.name)+'</option>').join('')
    + '<option value="__new">➕ New campaign…</option>';
  view.innerHTML = '<div class="card"><h3>Import a list (CSV)</h3>'
    + '<p class="muted">Upload a CSV of people, map the columns, pick a campaign, and import. New organizations are created automatically. The file is read in your browser and posted only to your local server.</p>'
    + '<div class="controls"><label>Campaign <select id="impcamp" onchange="onImpCampChange()">'+opts+'</select></label>'
    +   '<span id="impnewwrap" hidden>&nbsp;New name <input id="impnewname" placeholder="e.g. Investors"></span></div>'
    + '<div class="controls"><label>CSV file <input type="file" id="impfile" accept=".csv,text/csv" onchange="onCsvFile(event)"></label></div>'
    + '<div id="impmap"></div><div id="impresult" class="muted" style="margin-top:8px"></div></div>';
}
function onImpCampChange(){ document.getElementById("impnewwrap").hidden = document.getElementById("impcamp").value !== "__new"; }
function onCsvFile(ev){
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { window.__csv = parseCSV(rd.result); drawMapping(); };
  rd.readAsText(f);
}
function drawMapping(){
  const csv = window.__csv || {}, hdrs = csv.headers || [];
  const box = document.getElementById("impmap");
  if (!hdrs.length){ box.innerHTML = '<p class="err">Could not read any columns from that file.</p>'; return; }
  const colOpts = (ex) => hdrs.map((hh,ix) => '<option value="'+ix+'"'+(ex && ex.test(hh)?' selected':'')+'>'+esc(hh)+'</option>').join('');
  const none = '<option value="-1">— none —</option>';
  const fields = [["name","Name (required)",/name|full/i],["email","Email",/e-?mail/i],
    ["org","Organization",/org|company|outlet|inst/i],["role","Role / title",/role|title|position/i],
    ["notes","Notes",/note|comment/i]];
  const cid = document.getElementById("impcamp").value;
  const camp = (RAW.campaigns||[]).find(c => c.id === cid);
  const states = camp ? camp.states : [{key:"prospect",label:"Prospect"},{key:"contacted",label:"Contacted"},{key:"replied",label:"Replied"},{key:"won",label:"Won"},{key:"lost",label:"Lost"}];
  let h = '<div class="card"><h3>Map columns · '+csv.rows.length+' rows</h3>';
  fields.forEach(f => h += '<div class="controls"><label style="min-width:140px">'+f[1]+'</label> <select id="map_'+f[0]+'">'+(f[0]==="name"?"":none)+colOpts(f[2])+'</select></div>');
  h += '<div class="controls"><label style="min-width:140px">Initial state</label> <select id="impstate">'+states.map(s => '<option value="'+esc(s.key)+'">'+esc(s.label)+'</option>').join('')+'</select></div>';
  h += '<div class="actionbar"><button class="btn win" onclick="doImport()">Import '+csv.rows.length+' rows</button></div></div>';
  box.innerHTML = h;
}
async function doImport(){
  const csv = window.__csv || {}, res = document.getElementById("impresult");
  if (location.protocol === "file:"){ res.innerHTML = '<span class="err">Read-only — open via http://localhost:8787/app.html.</span>'; return; }
  let cid = document.getElementById("impcamp").value, cname = "";
  if (cid === "__new"){
    cname = (document.getElementById("impnewname").value||"").trim();
    if (!cname){ res.innerHTML = '<span class="err">Enter a name for the new campaign.</span>'; return; }
    cid = cname.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "campaign";
  }
  const idx = (f) => { const el = document.getElementById("map_"+f); return el ? parseInt(el.value,10) : -1; };
  const m = { name: idx("name"), email: idx("email"), org: idx("org"), role: idx("role"), notes: idx("notes") };
  if (m.name < 0){ res.innerHTML = '<span class="err">Pick the Name column.</span>'; return; }
  const get = (r,i) => i >= 0 ? (r[i]||"") : "";
  const rows = csv.rows.map(r => ({ name:get(r,m.name), email:get(r,m.email), org:get(r,m.org), role:get(r,m.role), notes:get(r,m.notes) })).filter(x => x.name.trim());
  res.textContent = "Importing…";
  try {
    const r = await fetch("/import", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ campaignId: cid, campaignName: cname, defaultState: document.getElementById("impstate").value, rows }) });
    const d = await r.json();
    if (!r.ok){ res.innerHTML = '<span class="err">Import failed: '+esc(d.error||r.status)+'</span>'; return; }
    res.innerHTML = 'Imported <b>'+d.addedLeads+'</b> leads ('+d.addedOrgs+' new orgs)'+(d.createdCampaign?' into new campaign <b>'+esc(cid)+'</b>':'')+'. Refreshing…';
    window.__csv = null;
    await load();
    setTab("people");
  } catch(e){ res.innerHTML = '<span class="err">Server error — is crm.py running?</span>'; }
}
// ---- Unmatched: inbound the bot could not match to a lead. Promote = one-row /import + drop the entry. ----
function renderUnmatched() {
  const items = RAW.unmatched || [], camps = RAW.campaigns || [];
  let h = '<div class="card"><h3>Unmatched inbound</h3>'
    + '<p class="muted">Messages the bot could not attach to a lead. Promote one to create the person (and their organization) in a campaign; the bot will match them from now on. Dismiss drops it. See BOT.md.</p>';
  if (!items.length) h += '<p class="muted">Nothing waiting.</p>';
  if (!camps.length && items.length) h += '<p class="err">Create a campaign first (Import CSV tab).</p>';
  h += '</div>';
  const copts = camps.map(c => '<option value="'+esc(c.id)+'">'+esc(CAMPLABEL[c.id]||c.name)+'</option>').join('');
  items.forEach((u, i) => {
    h += '<div class="card" id="um'+i+'"><div class="kv"><b>'+esc(u.name || u.from || "(unknown)")+'</b>'
      + '<span class="badge b-active">'+esc(u.channel||"")+'</span>'
      + (u.link ? ' <a class="link" href="'+esc(u.link)+'" target="_blank">open ↗</a>' : '') + '</div>'
      + '<div class="kv muted">'+esc(u.from||"")+(u.subject?' · '+esc(u.subject):'')+(u.date?' · '+ilTime(u.date,true):'')+'</div>'
      + '<div class="controls"><label>Campaign <select id="umc'+i+'">'+copts+'</select></label>'
      + '<label>Organization <input id="umo'+i+'" value="'+esc(u.guessOrg && u.guessOrg !== "-" ? u.guessOrg : "")+'" placeholder="optional"></label>'
      + '<button class="btn win" onclick="promoteUnmatched('+i+')"'+(camps.length?'':' disabled')+'>Promote</button>'
      + '<button class="btn" onclick="dismissUnmatched('+i+')">Dismiss</button>'
      + '<span id="umr'+i+'" class="muted"></span></div></div>';
  });
  view.innerHTML = h;
}
async function promoteUnmatched(i){
  const u = (RAW.unmatched||[])[i], res = document.getElementById("umr"+i); if (!u) return;
  const row = { name: u.name || u.from || "", org: document.getElementById("umo"+i).value, notes: u.subject || "",
                email: u.channel === "email" ? (u.from||"") : "", linkedin: u.channel === "linkedin" ? (u.from||"") : "" };
  res.textContent = "Promoting…";
  try {
    const r = await fetch("/import", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ campaignId: document.getElementById("umc"+i).value, rows:[row], dismissLinks:[u.link] }) });
    const d = await r.json();
    if (!r.ok){ res.innerHTML = '<span class="err">'+esc(d.error||r.status)+'</span>'; return; }
    await load();
  } catch(e){ res.innerHTML = '<span class="err">Server error — is crm.py running?</span>'; }
}
async function dismissUnmatched(i){
  const u = (RAW.unmatched||[])[i]; if (!u) return;
  try {
    const r = await fetch("/dismiss", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ links:[u.link] }) });
    if (r.ok) await load();
  } catch(e){}
}
// Minimal RFC-4180-ish CSV parser: handles quoted fields, escaped quotes, newlines in quotes.
function parseCSV(text){
  const rows = []; let row = [], field = "", i = 0, q = false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while (i < text.length){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ field += '"'; i += 2; continue; } q = false; i++; continue; }
      field += ch; i++; continue;
    }
    if (ch === '"'){ q = true; i++; continue; }
    if (ch === ','){ row.push(field); field = ""; i++; continue; }
    if (ch === '\n'){ row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    field += ch; i++;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  const nonEmpty = rows.filter(r => r.some(c => c.trim() !== ""));
  const headers = (nonEmpty.shift() || []).map(h => h.trim());
  return { headers, rows: nonEmpty };
}

// ---- Ask (plain-English assistant) ----
function renderAsk(){
  const hist = window.__askHistory || [];
  view.innerHTML = '<div class="card"><h3>Ask — plain English</h3>'
    + '<p class="muted">Chat about how this CRM works and what to do next. It reads a summary of your data but <b>cannot change anything</b> — it explains and points you at the right control. Enable it by exporting <code>ANTHROPIC_API_KEY</code> (Claude) or <code>OPENAI_API_KEY</code> (ChatGPT) before starting the server.</p>'
    + '<div id="asklog">' + hist.map(mm =>
        '<div class="trail-row"><span class="trail-when">'+(mm.role==="user"?"you":"ai")+'</span><span>'+esc(mm.content).replace(/\n/g,"<br>")+'</span></div>').join('') + '</div>'
    + '<div style="display:flex;gap:6px;margin-top:8px"><input id="askin" placeholder="e.g. What should I do today?  How do I close a lead as won?" style="flex:1;font:inherit;font-size:13px;padding:6px 8px;border:1px solid #d8d8d2;border-radius:6px" onkeydown="if(event.key===\'Enter\')doAsk()"><button class="btn" onclick="doAsk()">Send</button></div>'
    + '<div id="askerr" class="muted" style="margin-top:6px"></div></div>';
  const box = document.getElementById("asklog"); if (box) box.scrollTop = box.scrollHeight;
}
async function doAsk(){
  const inp = document.getElementById("askin"); const q = (inp.value||"").trim(); if (!q) return;
  window.__askHistory = window.__askHistory || [];
  window.__askHistory.push({ role:"user", content:q });
  renderAsk(); document.getElementById("askerr").textContent = "thinking…";
  try {
    const r = await fetch("/ask", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ question:q, history: window.__askHistory.slice(0,-1), leadId: window.__personId || null }) });
    const d = await r.json();
    window.__askHistory.push({ role:"assistant", content: d.answer || d.error || "(no answer)" });
    renderAsk();
  } catch(e){ document.getElementById("askerr").textContent = "Server error — is crm.py running?"; }
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => setTab(b.dataset.tab));
load();
</script>
